name: Node SDK matrix
# Manual dispatch only during the publishing program.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node }}' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install numpy pytest setuptools wheel
      - name: Syntax and full local suite (Linux)
        if: runner.os == 'Linux'
        run: |
          for f in $(find sdk demos -name '*.mjs' -o -name '*.cjs' | grep -v node_modules); do node --check "$f"; done
          python -m pytest -q
      - name: Build and check the native addon
        shell: bash
        run: |
          node_bin="$(command -v node)"
          root="$(cd "$(dirname "$node_bin")/.." && pwd)"
          for candidate in "$root/include/node" /usr/include/node; do
            if [ -f "$candidate/node_api.h" ]; then export NODE_API_INCLUDE="$candidate"; break; fi
          done
          if [ -z "${NODE_API_INCLUDE:-}" ]; then
            version="$(node -p process.version)"
            mkdir -p build/node-headers
            curl -fsSL "https://nodejs.org/download/release/${version}/node-${version}-headers.tar.gz" | tar -xz -C build/node-headers
            export NODE_API_INCLUDE="$PWD/build/node-headers/node-${version}/include/node"
          fi
          extra=()
          case "$(uname -s)" in
            MINGW*|MSYS*|CYGWIN*)
              export NODE_API_INCLUDE="$(cygpath -m "$NODE_API_INCLUDE")"
              curl -fsSL -o build/node.lib "https://nodejs.org/download/release/${version}/win-x64/node.lib"
              extra=(-DNODE_IMPORT_LIB="$(cygpath -m "$PWD/build/node.lib")")
              ;;
          esac
          ls "$NODE_API_INCLUDE/node_api.h"
          echo "NODE_API_INCLUDE=$NODE_API_INCLUDE"
          cmake -S engine -B build -DCMAKE_BUILD_TYPE=Release -DWAKE_BUILD_NODE=ON -DNODE_API_INCLUDE="$NODE_API_INCLUDE" "${extra[@]}"
          cmake --build build --config Release -j2
