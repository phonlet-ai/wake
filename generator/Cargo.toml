[package]
name = "wake-threshold"
version = "0.2.0"
edition = "2024"
description = "Phonlet Wake threshold generator: phrase text to calibrated keyword thresholds, one self-contained binary"
license = "PolyForm-Noncommercial-1.0.0"
publish = false

[[bin]]
name = "wake-threshold"
path = "src/main.rs"

[lib]
name = "wake_threshold"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
miniz_oxide = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.10"
unicode-general-category = "1"
unicode-normalization = "0.1"

[build-dependencies]
miniz_oxide = "0.8"
serde_json = "1"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 2

[profile.dev.build-override]
opt-level = 3

[profile.release.build-override]
opt-level = 3
