name: Python SDK matrix
# Manual dispatch only during the publishing program.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '${{ matrix.python }}' }
      - run: python -m pip install numpy pytest setuptools wheel build
      - name: Tests from checkout (Linux)
        if: runner.os == 'Linux'
        run: python -m pytest -q
      - name: Build wheel
        run: python -m build --wheel sdk/python
      - name: Install wheel and import smoke
        shell: bash
        run: |
          wheel="$(find sdk/python/dist -name '*.whl' | head -1)"
          python -m pip install --disable-pip-version-check "$wheel"
          python -c "import json,pathlib,phonlet_wake as w; a=w.WakeAssets.from_files(model=pathlib.Path('resources/models/en-1/model.pwake'),keywords=pathlib.Path('resources/packs/en/keywords.json'),manifest=pathlib.Path('resources/packs/en/manifest.json')); print(json.dumps(a.validate()['metadata']['status']))"
